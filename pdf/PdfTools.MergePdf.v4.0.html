<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .container {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            width: 100%;
            height: 100%;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .pdf-merger {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .pdf-viewer {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            height: 100%;
        }

        .drag-drop {
            border: 2px dashed #aaa;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .pdf-file {
            background-color: #e1f5fe;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="pdf-merger">
            <h2>PDF Merger</h2>
            <div class="drag-drop" id="dragDrop">
                Drag and drop PDF files here or click to upload.
            </div>
            <div id="fileList"></div>
            <button onclick="mergePDFs()">Merge PDFs</button>
        </div>
        <div class="pdf-viewer">
            <h3>Merged PDF Viewer</h3>
            <embed id="pdfViewer" type="application/pdf" width="100%" height="90%" />
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
    <script>
        // PDF Merger Section
        let pdfFiles = [];

        function handleDrop(event) {
            event.preventDefault();
            const files = event.dataTransfer.files;
            handleFiles(files);
        }

        function handleFiles(files) {
            for (const file of files) {
                if (file.type === "application/pdf") {
                    pdfFiles.push(file);
                    renderFile(file);
                }
            }
        }

        function renderFile(file) {
            const fileList = document.getElementById('fileList');
            const fileElem = document.createElement('div');
            fileElem.className = 'pdf-file';
            fileElem.textContent = file.name;
            fileList.appendChild(fileElem);
        }

        async function mergePDFs() {
            const mergedPdf = await PDFLib.PDFDocument.create();

            for (let index = 0; index < pdfFiles.length; index++) {
                const file = pdfFiles[index];

                // Read each file sequentially
                const existingPdfBytes = await readFileAsUint8Array(file);
                const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
                const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());

                copiedPages.forEach((page) => {
                    mergedPdf.addPage(page);
                });
            }

            // Save the merged PDF and update viewer
            const mergedPdfBytes = await mergedPdf.save();
            const mergedPdfDataUri = URL.createObjectURL(new Blob([mergedPdfBytes], { type: 'application/pdf' }));
            document.getElementById('pdfViewer').src = mergedPdfDataUri;
        }

        function readFileAsUint8Array(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const arrayBuffer = event.target.result;
                    const uint8Array = new Uint8Array(arrayBuffer);
                    resolve(uint8Array);
                };
                reader.onerror = (error) => {
                    reject(error);
                };
                reader.readAsArrayBuffer(file);
            });
        }

        document.getElementById('dragDrop').addEventListener('dragover', (event) => {
            event.preventDefault();
        });
        document.getElementById('dragDrop').addEventListener('drop', handleDrop);
    </script>
</body>

</html>
